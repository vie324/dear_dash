<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gold geometric mandala pattern -->
    <linearGradient id="phoenixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f28b9e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e85d75;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4344f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoenixGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5a0b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e86880;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4a84a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a08830;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gold geometric mandala (rotated squares forming flower) -->
  <g transform="translate(240, 140)" fill="none" stroke="#b8a040" stroke-width="1.5" opacity="0.85">
    <rect x="-70" y="-70" width="140" height="140" rx="2" transform="rotate(0)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="2" transform="rotate(15)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="2" transform="rotate(30)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="2" transform="rotate(45)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="2" transform="rotate(60)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="2" transform="rotate(75)"/>
    <!-- Inner mandala -->
    <rect x="-50" y="-50" width="100" height="100" rx="2" transform="rotate(0)"/>
    <rect x="-50" y="-50" width="100" height="100" rx="2" transform="rotate(15)"/>
    <rect x="-50" y="-50" width="100" height="100" rx="2" transform="rotate(30)"/>
    <rect x="-50" y="-50" width="100" height="100" rx="2" transform="rotate(45)"/>
    <rect x="-50" y="-50" width="100" height="100" rx="2" transform="rotate(60)"/>
    <rect x="-50" y="-50" width="100" height="100" rx="2" transform="rotate(75)"/>
    <!-- Innermost -->
    <rect x="-30" y="-30" width="60" height="60" rx="2" transform="rotate(0)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="2" transform="rotate(15)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="2" transform="rotate(30)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="2" transform="rotate(45)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="2" transform="rotate(60)"/>
    <rect x="-30" y="-30" width="60" height="60" rx="2" transform="rotate(75)"/>
  </g>

  <!-- Phoenix bird - main body swoosh -->
  <path d="M 80 350
           C 40 300, 30 240, 60 190
           C 80 160, 110 140, 140 130
           C 170 120, 190 125, 200 140
           C 220 170, 200 210, 170 240
           C 150 260, 120 270, 100 290
           C 85 305, 80 320, 80 350 Z"
        fill="url(#phoenixGrad2)" opacity="0.7"/>

  <!-- Phoenix - outer wing -->
  <path d="M 60 350
           C 20 290, 10 220, 40 160
           C 60 120, 100 90, 140 80
           C 160 75, 170 85, 165 100
           C 155 130, 120 150, 90 180
           C 60 210, 50 260, 60 350 Z"
        fill="url(#phoenixGrad1)" opacity="0.9"/>

  <!-- Phoenix - inner red accent -->
  <path d="M 120 330
           C 100 290, 95 250, 110 210
           C 120 185, 145 165, 160 160
           C 170 158, 175 165, 170 175
           C 160 200, 140 230, 130 270
           C 125 290, 120 310, 120 330 Z"
        fill="#d4344f" opacity="0.85"/>

  <!-- Phoenix - head/beak -->
  <path d="M 200 240
           C 210 230, 230 225, 250 230
           C 260 233, 265 238, 260 242
           C 250 250, 230 248, 210 245
           C 205 244, 200 243, 200 240 Z"
        fill="url(#phoenixGrad2)"/>

  <!-- Phoenix eye -->
  <circle cx="215" cy="225" r="4" fill="#d4344f"/>

  <!-- Tail feathers -->
  <path d="M 40 340
           C 15 310, 5 270, 20 230
           C 28 210, 40 200, 42 210
           C 45 230, 35 270, 40 340 Z"
        fill="#f5a0b0" opacity="0.6"/>
</svg>
